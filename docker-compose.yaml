services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # The image bucket in dev, standing in for Cloudflare R2: SeaweedFS's all-in-one
  # `mini` (MinIO stopped publishing community images in late 2025). It creates
  # S3_BUCKET on start, so there is no init step. The S3 identities are written
  # at start from .env: the key pair gets full access and `anonymous` may only
  # read, which makes objects public like the R2 bucket behind its custom domain.
  # CORS is SeaweedFS's default, every origin with any method and header.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: >
      sh -c 'printf "%s" "{\"identities\": [
      {\"name\": \"anonymous\", \"actions\": [\"Read:$$S3_BUCKET\"]},
      {\"name\": \"amandu\", \"actions\": [\"Admin\", \"Read\", \"List\", \"Write\", \"Tagging\"],
      \"credentials\": [{\"accessKey\": \"$$S3_ACCESS_KEY_ID\", \"secretKey\": \"$$S3_SECRET_ACCESS_KEY\"}]}]}"
      > /etc/s3.json && exec /entrypoint.sh mini -s3.port=9000 -s3.config=/etc/s3.json'
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    # The browser PUTs and reads here directly, so it is published to the host.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - seaweedfsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    volumes:
      - .:/usr/src/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:9000
    depends_on:
      seaweedfs:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seaweedfsdata:
