[project]
name = "amandu-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-phonenumber-field[phonenumbers]>=8.4.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "pywebpush>=2.3.0",
    "redis>=8.0.1",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
# --ds (command-line precedence) beats the container's DJANGO_SETTINGS_MODULE env
# var, which the plain ini key does NOT: without this the suite silently runs under
# development settings instead of test (real email backend, slow hasher, real Redis).
addopts = "--ds=config.settings.test"

[dependency-groups]
dev = [
    "djangorestframework-stubs>=3.17.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
